      pool:
        max-active: 200     # 最大连接数（负值表示没有限制）
        max-idle: 10       # 最大空闲连接数
        min-idle: 0       # 最小空闲连接数
        max-wait: -1ms    # 连接池最大等待时间（负值表示一直等）

